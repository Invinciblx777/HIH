# Render Blueprint for the AegisLab public READ-ONLY demo (Finale P6). Spec: https://render.com/docs/blueprint-spec
#
# What this deploys: aegislab/app.py, which forces AEGIS_PUBLIC_DEMO=1. The console then serves browse, replay, the
# independent verifier and tamper-on-a-disposable-copy only: no launch code, no operator session, no runs, no containers,
# no model. The live lab still needs a rootless-Podman Linux host (scripts/start_prototype.sh); it never runs here.
services:
  - type: web
    name: aegislab-demo
    runtime: python
    repo: https://github.com/Invinciblx777/HIH
    branch: main
    rootDir: aegislab            # changes outside aegislab/ do not trigger a deploy
    region: singapore            # closest Render region to the venue and judges; cannot be changed after creation

    # PLAN: a deliberate choice, pick one before creating the service.
    #   free        - $0. Spins down after 15 min without inbound traffic; the next request wakes it in up to 1 min (23.6 s measured, 12 Nov 2026).
    #                 The filesystem is reset on spin-down (harmless: the demo keeps no state worth keeping, AEGIS_VAR=/tmp).
    #                 If you choose free, open the URL a few minutes before the judges do.
    #   0.5c-512mb  - Render's smallest paid instance (the default when plan is omitted). Never sleeps.
    plan: free

    # Build: pip with the verified constraints, not uv. requirements.txt + constraints.txt is the exact set that the CI
    # release-gates job and every local gate install and test (Python 3.14). uv.lock is regenerated metadata for the project
    # itself; using it would need `uv sync` plus a .venv start path, a second install path that no gate exercises.
    buildCommand: pip install -r requirements.txt -c constraints.txt

    # --no-proxy-headers: uvicorn must not rewrite the client address or scheme from X-Forwarded-For/-Proto. We cannot name
    # Render's proxy addresses for --forwarded-allow-ips, and '*' would let any client set them. The console reads the client
    # address only from AEGIS_CLIENT_IP_HEADER (below) and accepts an http or https Origin for its own Host, so it needs neither.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-server-header --no-proxy-headers

    healthCheckPath: /api/lab/status
    autoDeployTrigger: commit    # deploy every commit to main (the old autoDeploy: true). checksPass would wait for CI.
    numInstances: 1              # the rate limits are per process; one instance keeps the global limit exact

    envVars:
      - key: PYTHON_VERSION      # Render needs a fully qualified version here; 3.14 is what CI and the constraints were verified on
        value: 3.14.10
      - key: AEGIS_CLIENT_IP_HEADER
        value: CF-Connecting-IP  # overwritten by Render's edge on every request; X-Forwarded-For is appended to, so forgeable
