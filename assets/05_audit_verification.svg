serif" font-size="16" font-weight="800" fill="#13233A" text-anchor="start">HASH-CHAINED AUDIT LOG</text><g><rect x="340" y="230" width="230" height="80" rx="12" fill="#E2F3EA" stroke="#2E8B62" stroke-width="2"/><text x="455" y="266.3" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" fill="#1D1D1F" text-anchor="middle">Signed checkpoint</text><text x="455" y="288.3" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#5B6B7F" text-anchor="middle">Ed25519 {seq, head}</text></g><g><path d="M455 180 L455 230" fill="none" stroke="#2E8B62" stroke-width="2.5" marker-end="url(#arr2E8B62)"/></g><g><rect x="820" y="70" width="340" height="130" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="2"/><text x="990" y="120" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="20" fill="#1D1D1F" text-anchor="middle">Reviewer vault</text><text x="990" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">independent copy of checkpoints</text><text x="990" y="166" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">kept outside the run store</text></g><g><path d="M570 270 L990 270 L990 200" fill="none" stroke="#2E8B62" stroke-width="2.5" marker-end="url(#arr2E8B62)"/><rect x="653.1" y="247" width="253.8" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="780" y="262" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#2E8B62" text-anchor="middle">pushed at freeze, seal, release</text></g><g><rect x="820" y="300" width="340" height="120" rx="12" fill="#FCEBDD" stroke="#E8772E" stroke-width="2"/><text x="990" y="345" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="20" fill="#1D1D1F" text-anchor="middle">Verifier</text><text x="990" y="369" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">recompute chain</text><text x="990" y="391" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">check signatures + heads</text></g><g><path d="M990 200 L990 300" fill="none" stroke="#1D1D1F" stroke-width="2.5" marker-end="url(#arr1D1D1F)"/></g><text x="40" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E8B62" text-anchor="start">Detects: edit · delete · reorder · rehash · truncation</text><text x="40" y="392" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E8B62" text-anchor="start">up to the last checkpoint the reviewer holds.</text><text x="40" y="428" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#C2453B" text-anchor="start">Not detected: false entries written by a compromised broker before signing.</text></svg>