arkerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F6F8FA"/></marker><marker id="arrFFFFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker><marker id="arrFFFFFFs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker><marker id="arrFBE7E5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FBE7E5"/></marker><marker id="arrFBE7E5s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FBE7E5"/></marker><marker id="arr13233A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#13233A"/></marker><marker id="arr13233As" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#13233A"/></marker><marker id="arrC2453B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2453B"/></marker><marker id="arrC2453Bs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2453B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="160" y="70" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="700" fill="#C2453B" text-anchor="middle">BEFORE EXECUTION</text><g><rect x="30" y="90" width="260" height="170" rx="12" fill="#FBE7E5" stroke="#C2453B" stroke-width="2"/><text x="160" y="160.7" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="22" fill="#C2453B" text-anchor="middle">Red commits</text><text x="160" y="184.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">H(nonce ‖ payload)</text><text x="160" y="206.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">only the hash is logged</text></g><g><path d="M292 175 L323 175" fill="none" stroke="#13233A" stroke-width="2.5" marker-end="url(#arr13233A)"/></g><text x="455" y="70" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="700" fill="#E8772E" text-anchor="middle">DURING EXECUTION</text><g><rect x="325" y="90" width="260" height="170" rx="12" fill="#FCEBDD" stroke="#E8772E" stroke-width="2"/><text x="455" y="160.7" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="22" fill="#E8772E" text-anchor="middle">Broker checks</text><text x="455" y="184.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">payload + nonce must</text><text x="455" y="206.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">match the commitment</text></g><g><path d="M587 175 L618 175" fill="none" stroke="#13233A" stroke-width="2.5" marker-end="url(#arr13233A)"/></g><text x="750" y="70" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="700" fill="#5B6B7F" text-anchor="middle">SEALED</text><g><rect x="620" y="90" width="260" height="170" rx="12" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="2"/><text x="750" y="160.7" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="22" fill="#5B6B7F" text-anchor="middle">Artifacts held</text><text x="750" y="184.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">payloads, outputs, verdicts</text><text x="750" y="206.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">behind the result gate</text></g><g><path d="M882 175 L913 175" fill="none" stroke="#13233A" stroke-width="2.5" marker-end="url(#arr13233A)"/></g><text x="1045" y="70" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="700" fill="#2E8B62" text-anchor="middle">AFTER RELEASE</text><g><rect x="915" y="90" width="260" height="170" rx="12" fill="#E2F3EA" stroke="#2E8B62" stroke-width="2"/><text x="1045" y="160.7" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="22" fill="#2E8B62" text-anchor="middle">Anyone verifies</text><text x="1045" y="184.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">recompute each hash</text><text x="1045" y="206.7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#5B6B7F" text-anchor="middle">from released payloads</text></g><text x="600" y="320" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle">Blue participants never see payloads before release. The defence runner processes them in isolation.</text><text x="600" y="352" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B7F" text-anchor="middle">A 128-bit nonce stops guessing short payloads from the logged hash.</text></svg>