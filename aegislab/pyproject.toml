[project]
name = "aegislab"
version = "0.1.0"
description = "AegisLab: an isolated, auditable evaluation lab for red/blue AI security exercises"
requires-python = ">=3.12"
# httpx is a runtime dependency: the console drives the control-plane API in-process with FastAPI's TestClient
# (aegis/console.py), which needs it.
dependencies = [ "fastapi>=0.115", "uvicorn>=0.30", "cryptography>=43", "httpx>=0.27" ]

# Test-only. Not part of the runtime: `uv sync --no-dev` (and Vercel's build, which installs the project's runtime
# dependencies) leaves it out; `uv sync` includes the dev group by default, and requirements.txt still lists it for the tests.
[dependency-groups]
dev = [ "pytest>=8" ]
